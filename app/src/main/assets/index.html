<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fiber Circuit Viewer</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#172b41;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:4;background:#12344e;color:white;padding:14px 16px 12px;box-shadow:0 3px 15px #16293b22}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between}.title{font-size:19px;font-weight:800}.subtitle{opacity:.75;font-size:12px}.btn{border:0;border-radius:10px;background:#e2ecf7;color:#173c5b;padding:10px 12px;font-weight:750;cursor:pointer}.btn.primary{background:#2887df;color:white}.top .btn{background:#e1efff;color:#164266}.search{margin-top:12px;width:100%;padding:12px 14px;border:1px solid #c4d2e1;border-radius:12px;font-size:16px}.wrapper{max-width:1150px;margin:auto;padding:14px 12px 45px}.intro{background:#fff;border:1px solid #d9e2ed;border-radius:15px;padding:16px;margin-bottom:15px}.mainname{font-size:21px;font-weight:800;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pill{font-size:12px;background:#e7f0fb;border-radius:7px;padding:5px 8px;color:#225074;font-weight:700}.timeline{position:relative}.item{position:relative;background:#fff;border:1px solid #dce3eb;border-left:5px solid #929cab;border-radius:13px;padding:12px 13px;margin:10px 0;box-shadow:0 2px 8px #14283a0a;overflow-wrap:anywhere}.item.joint{border-left-color:#e4912b}.item.cable{border-left-color:#2775ce}.item.building{border-left-color:#438b6a}.item.other{border-left-color:#8996a5}.itemhead{display:flex;align-items:start;justify-content:space-between;gap:8px}.type{font-size:11px;letter-spacing:.06em;font-weight:850;color:#5b7086}.joint .type{color:#a9600e}.cable .type{color:#1a65b7}.name{font-size:16px;font-weight:750;margin:4px 0;overflow-wrap:anywhere}.id{font-size:12px;color:#586b7b}.detail{line-height:1.5;font-size:14px;margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{background:#f0f5fb;border-radius:6px;padding:5px 8px;font-size:13px}.actionrow{display:flex;gap:7px;flex-shrink:0}.mini{font-size:12px;border:1px solid #cbd9e5;border-radius:8px;padding:7px 9px;background:#fff;color:#1b577f;font-weight:700}.empty{text-align:center;background:#fff;padding:35px 22px;border-radius:16px;color:#5c6b7a}.small{font-size:12px;color:#687c8c}.hide{display:none!important}.filters{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.filter{padding:8px 12px;border-radius:18px;border:1px solid #cbd9e5;background:white;font-weight:650;white-space:nowrap}.filter.active{background:#163d60;color:white}.raw{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:16px;border-radius:12px;font:13px/1.5 monospace}.stats{font-size:12px;color:#6b7f8e;margin:10px 0}.fab{position:fixed;bottom:15px;right:15px;z-index:4;border:0;border-radius:99px;background:#276eab;color:white;padding:12px 17px;box-shadow:0 4px 18px #0003;font-weight:800}@media(min-width:630px){.wrapper{padding:20px}.item{padding:16px 19px}.name{font-size:17px}.detail{font-size:15px}.intro{padding:20px}.top{padding-left:max(20px,calc((100vw - 1110px)/2));padding-right:max(20px,calc((100vw - 1110px)/2))}}@media(min-width:1000px){.timeline{columns:1}.item{break-inside:avoid}}
</style></head><body>
<header class="top"><div class="topbar"><div><div class="title">Fiber Circuit Viewer</div><div class="subtitle">Circuiti Fastweb · visualizzazione offline</div></div><button class="btn" id="openBtn">Apri HTML</button></div><input class="search hide" id="search" placeholder="Cerca ID, giunto, cavo, fibra, indirizzo..." type="search"/></header>
<main class="wrapper"><div id="welcome" class="empty"><h2>Apri un circuito</h2><p>Seleziona un file HTML esportato dal gestionale Fastweb. Il documento rimane sul dispositivo.</p><button class="btn primary" id="welcomeBtn">Seleziona circuito HTML</button><p class="small">Compatibile con i due formati forniti: GPON testuale e report tabellare.</p></div><div id="content" class="hide"><div class="intro"><div class="small" id="filename"></div><div class="mainname" id="circuit"></div><div class="meta" id="meta"></div></div><div class="filters" id="filters"><button class="filter active" data-filter="all">Tutti</button><button class="filter" data-filter="joint">Giunti</button><button class="filter" data-filter="cable">Cavi</button><button class="filter" data-filter="building">Edifici</button><button class="filter" data-filter="other">Altro</button></div><div class="stats" id="stats"></div><div class="timeline" id="timeline"></div><div id="noResults" class="empty hide">Nessun elemento trovato.</div><div style="margin-top:16px"><button class="btn" id="rawBtn">Mostra HTML originale</button><div class="raw hide" id="raw"></div></div></div></main><button class="fab hide" id="up" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Inizio</button><input id="browserFile" type="file" accept=".html,.htm,text/html" class="hide">
<script>
'use strict';
let rows=[],original='',activeFilter='all';
const $=x=>document.getElementById(x);const clean=s=>(s||'').replace(/\s+/g,' ').trim();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function kind(s){return /\bgiunto\s*:/i.test(s)||/^Giunto\s*\(/i.test(s)?'joint':/\bcavo\s*:/i.test(s)||/^Cavo\s*\(/i.test(s)?'cable':/\bedificio\s*:/i.test(s)||/^Edificio\s*\(/i.test(s)?'building':'other'}
function label(k){return ({joint:'GIUNTO',cable:'CAVO',building:'EDIFICIO',other:'ELEMENTO'})[k]}
function stripPrefix(s){return s.replace(/^(Giunto|Cavo|Edificio)\s*(?:\(Id\.\s*\d+\))?\s*:\s*/i,'').trim()}
function parseTable(doc){const t=doc.querySelector('table');if(!t)return [];return [...t.querySelectorAll('tbody tr')].map(tr=>{const td=[...tr.querySelectorAll('td')];const vals=td.map(x=>clean(x.textContent));const type=kind(vals[1]||'');const anchor=td[1]?.querySelector('a[href]');const url=anchor?.getAttribute('href')||'';return {kind:type,id:vals[0]||'',name:stripPrefix(vals[1]||''),extra:vals.slice(2).filter(Boolean),link:/^https:\/\/www\.google\.(it|com)\/maps\//.test(url)?url:'',raw:vals.join(' | ')};}).filter(x=>x.id||x.name)}
function textLines(body){const lines=[];let acc='';function flush(){let v=clean(acc);if(v)lines.push(v);acc=''}function walk(n){if(n.nodeType===3){acc+=n.nodeValue;return}if(n.nodeType!==1)return;const tag=n.tagName.toLowerCase();if(tag==='br'){flush();return}if(['script','style'].includes(tag))return;if(['p','div','h1','h2','h3','table'].includes(tag))flush();for(const child of n.childNodes)walk(child);if(['p','div','h1','h2','h3','table'].includes(tag))flush()}walk(body);flush();return lines}
function parseLegacy(doc){let entries=textLines(doc.body);const out=[];let started=false;for(const line of entries){const mt=line.match(/(?:^|\s)(Edificio|Armadio|Cavo|Giunto)\s*(?:\(Id\.\s*(\d+)\))?\s*:/i);if(mt){started=true;const k=kind(mt[1]+':');const text=line.slice(mt.index).replace(/^\s*/,'');const id=mt[2]||'';const noId=stripPrefix(text);const parts=noId.split(/\s*;\s*/);out.push({kind:k,id,name:parts.shift()||noId,extra:parts,link:'',raw:line});}else if(started&&out.length&&!/^©|fastweb|\d{2}\/\d{2}\/\d{4}/i.test(line)){out[out.length-1].extra.push(line)}}return out}
function parse(html){const doc=new DOMParser().parseFromString(html,'text/html');const structured=doc.querySelector('table tbody tr');const out=structured?parseTable(doc):parseLegacy(doc);if(!out.length)throw new Error('Formato non riconosciuto: nessun cavo o giunto trovato.');const heading=clean(doc.querySelector('.header-title')?.textContent)||clean(doc.querySelector('h2')?.textContent)||clean(doc.title)||'Circuito';const segment=clean([...doc.querySelectorAll('.header-title')].find(e=>/segmento/i.test(e.textContent))?.textContent)||clean((doc.body.textContent.match(/Seg\. Ottico:\s*([^\n]+)/i)||[])[1]||'');return {out,heading,segment,format:structured?'Tabellare':'GPON testuale'}}
function pick(){if(window.AndroidBridge&&window.AndroidBridge.pickFile)window.AndroidBridge.pickFile();else $('browserFile').click()}
$('openBtn').onclick=pick;$('welcomeBtn').onclick=pick;$('browserFile').addEventListener('change',async e=>{const f=e.target.files[0];if(f){const bytes=await f.arrayBuffer();let html=new TextDecoder("utf-8").decode(bytes);if(html.includes("\uFFFD"))html=new TextDecoder("windows-1252").decode(bytes);window.receiveHtml(html,f.name)};e.target.value=''});
window.receiveHtml=function(html,name){try{const p=parse(html);original=html;rows=p.out;activeFilter='all';$('search').value='';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));$('filename').textContent=name||'Circuito HTML';$('circuit').textContent=p.heading;$('meta').replaceChildren();[p.segment,p.format,rows.length+' elementi'].filter(Boolean).forEach(t=>{const s=document.createElement('span');s.className='pill';s.textContent=t;$('meta').append(s)});$('welcome').classList.add('hide');$('content').classList.remove('hide');$('search').classList.remove('hide');$('up').classList.remove('hide');$('raw').textContent=original;$('raw').classList.add('hide');$('rawBtn').textContent='Mostra HTML originale';render();window.scrollTo(0,0)}catch(e){alert('Impossibile visualizzare il circuito: '+e.message)}};
function copy(s){if(window.AndroidBridge&&window.AndroidBridge.copy)window.AndroidBridge.copy(s);else if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{}).catch(()=>prompt('Copia ID',s));else prompt('Copia ID',s)}
function render(){const q=$('search').value.toLocaleLowerCase('it').trim();const filtered=rows.filter(r=>(activeFilter==='all'||r.kind===activeFilter)&&(!q||[r.id,r.name,...r.extra,r.raw].join(' ').toLocaleLowerCase('it').includes(q)));$('stats').textContent=`${filtered.length} di ${rows.length} elementi · ordine originale mantenuto`;$('timeline').replaceChildren();$('noResults').classList.toggle('hide',filtered.length!==0);
for(const r of filtered){const item=document.createElement('article');item.className='item '+r.kind;const head=document.createElement('div');head.className='itemhead';const left=document.createElement('div');left.style.minWidth='0';const type=document.createElement('div');type.className='type';type.textContent=label(r.kind);const nm=document.createElement('div');nm.className='name';nm.textContent=r.name;left.append(type,nm);if(r.id){const id=document.createElement('div');id.className='id';id.textContent='ID '+r.id;left.append(id)}head.append(left);const actions=document.createElement('div');actions.className='actionrow';if(r.id){const button=document.createElement('button');button.className='mini';button.textContent='Copia ID';button.onclick=()=>copy(r.id);actions.append(button)}if(r.link){const a=document.createElement('a');a.className='mini';a.textContent='Mappa ↗';a.href=r.link;a.target='_blank';a.rel='noopener noreferrer';actions.append(a)}head.append(actions);item.append(head);if(r.extra.length){const tags=document.createElement('div');tags.className='tags';r.extra.forEach(t=>{const el=document.createElement('div');el.className='tag';el.textContent=t;tags.append(el)});item.append(tags)}$('timeline').append(item)}}
$('search').addEventListener('input',render);document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{activeFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));$('rawBtn').onclick=()=>{const e=$('raw');e.classList.toggle('hide');$('rawBtn').textContent=e.classList.contains('hide')?'Mostra HTML originale':'Nascondi HTML originale'};window.resetSearchAndScroll=()=>{$('search').value='';activeFilter='all';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));render();window.scrollTo(0,0)};
</script></body></html>
